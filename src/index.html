<!DOCTYPE html>
<html lang="en">
  <head>
    <title>FKCS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./scss/style.scss" />
    <link rel="icon" href="./img/icon.svg" type="image/svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FKCS - Creative Product Owner" />
    <meta charset="UTF-8" />
  </head>
  <body>
   <div class="menu-transition-layer">
</div>
    <nav class="nav">
      <div class="nav-container">
        <h3 class="company">FKCS</h3>
        <button class="burger" aria-label="Toggle menu">
         <svg class="burger-icon" width="18" height="8" viewBox="0 0 18 8" fill="none" xmlns="http://www.w3.org/2000/svg">
<path class="line-1" d="M12 1L1.93715e-07 0.999999" stroke="currentColor" stroke-width="0.3"/>
<path class="line-2" d="M15 2.5L3 2.5" stroke="currentColor" stroke-width="0.3"/>
<path class="line-3" d="M18 4L6 4" stroke="currentColor" stroke-width="0.3"/>
</svg>




        </button>
      </div>
      <ul class="menu">
        <li><a href="#home" class="link">Home</a></li>
        <li><a href="#about" class="link">About</a></li>
        <li><a href="#highlights" class="link">Projects</a></li>
        <li><a href="#contact" class="link">Contact</a></li>
        <li><div class="menu-socials"></div>
      </li>
      </ul>
    </nav>
    <section id="home" class="home">
      <div class="home-wrapper">
        <span class="po-qualifier-wrapper">
          <span id="po-qualifier" class="word-carousel"></span>
        </span>
        <div class="po-title-wrapper">
          <h1 id="po-title" class="variable-text"></h1>
        </div>
      </div>
    </section>
    <section class="hero full-screen">
      <div class="hero-wrapper">
        <div class="welcome-wrapper">
        <h2 class="welcome" data-welcome>Welcome !</h2>
      </div>
    </section>

    <section id="about" class="about">
      <div class="about-wrapper"></div>
    </section>
    <section id="highlights">
      <div class="highlights-wrapper">
        <h2 class="highlight-section-title">Projects</h2>
        <ul id="accordion"></ul>
      </div>
    </section>
    <section id="contact" class="contact full-screen">
      <button class="chevron-button">
        <div class="text-wrapper">
          <span class="variable-text2 button-text both-text">Contact me</span>
        </div>
        <svg
          class="chevron-svg"
          viewBox="0 0 200 50"
          preserveAspectRatio="none"
        >
          <defs>
            <polygon id="chevron" points="0,0 10,25 0,50 20,50 30,25 20,0" />
          </defs>
          <g class="chevron-track">
            <use href="#chevron" x="0" y="0" />
            <use href="#chevron" x="40" y="0" />
            <use href="#chevron" x="80" y="0" />
            <use href="#chevron" x="120" y="0" />
            <use href="#chevron" x="160" y="0" />
            <use href="#chevron" x="200" y="0" />
            <use href="#chevron" x="240" y="0" />
            <use href="#chevron" x="280" y="0" />
            <use href="#chevron" x="320" y="0" />
            <use href="#chevron" x="360" y="0" />
            <use href="#chevron" x="400" y="0" />
            <use href="#chevron" x="440" y="0" />
            <use href="#chevron" x="480" y="0" />
            <use href="#chevron" x="520" y="0" />
            <use href="#chevron" x="560" y="0" />
            <use href="#chevron" x="600" y="0" />
            <use href="#chevron" x="640" y="0" />
            <use href="#chevron" x="680" y="0" />
            <use href="#chevron" x="720" y="0" />
            <use href="#chevron" x="760" y="0" />
          </g>
        </svg>
      </button>
      <footer id="footer">
        <div class="footer-socials"></div>
      </footer>
    </section>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
